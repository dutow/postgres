name: Windows build
run-name: "Windows build — ${{ github.event_name }} @ ${{ github.sha }}"

on:
  push:
    branches:
      - "PSP_REL_*"
      - "wininst"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install vcpkg deps
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "ci/windows/vcpkg.json"
          runVcpkgInstall: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.4"

      - name: Install meson and ninja
        shell: pwsh
        run: |
          pip install --upgrade meson ninja

      - name: Install flex and bison
        shell: pwsh
        run: |
          choco install --no-progress -y winflexbison3

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install --no-progress -y pkgconfiglite

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          # Discover the actual vcpkg install directory (lukka/run-vcpkg uses a per-run GUID path).
          $candidates = @(
            $env:VCPKG_INSTALLED_DIR,
            $env:VCPKG_MANIFEST_INSTALL_DIR,
            "$env:VCPKG_ROOT/installed"
          ) | Where-Object { $_ -and (Test-Path $_) }

          # Look under workspace/runner-temp for the actual x64-windows tree.
          $searchRoots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) }
          $found = $searchRoots |
            ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "x64-windows" -Directory -ErrorAction SilentlyContinue -Depth 5 } |
            Where-Object { Test-Path (Join-Path $_.FullName "lib/pkgconfig") } |
            Select-Object -First 1

          $installRoot = if ($found) { $found.FullName } else { $null }
          if (-not $installRoot) {
            Write-Host "Candidates checked:"
            $candidates | ForEach-Object { Write-Host "  $_" }
            Get-ChildItem Env: | Where-Object { $_.Name -like "VCPKG*" } | Format-Table -AutoSize | Out-String | Write-Host
            throw "Could not locate vcpkg x64-windows install tree"
          }

          $pkgConfigPath = Join-Path $installRoot "lib/pkgconfig"
          Write-Host "vcpkg install root: $installRoot"
          Write-Host "pkg-config path:    $pkgConfigPath"
          Write-Host ".pc files found:    $((Get-ChildItem "$pkgConfigPath/*.pc" -ErrorAction SilentlyContinue).Count)"

          $env:CMAKE_PREFIX_PATH = $installRoot
          $env:PKG_CONFIG_PATH   = $pkgConfigPath

          # Put vcpkg bin on PATH for the Test step so dynamically-linked DLLs
          # (openssl, icu, zlib, etc.) resolve when postgres.exe/initdb.exe run.
          $vcpkgBin = Join-Path $installRoot "bin"
          if (Test-Path $vcpkgBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $vcpkgBin
            Write-Host "Added to GITHUB_PATH: $vcpkgBin"
            Write-Host "DLLs present: $((Get-ChildItem "$vcpkgBin/*.dll" -ErrorAction SilentlyContinue).Count)"
          } else {
            Write-Host "::warning::vcpkg bin directory not found at $vcpkgBin — tests will likely fail with missing DLLs"
          }

          $shortSha = "${{ github.sha }}".Substring(0,7)
          meson setup build `
            --buildtype=release `
            --prefix=C:/stage/pgsql `
            "--pkg-config-path=$pkgConfigPath" `
            "--cmake-prefix-path=$installRoot" `
            -Dssl=openssl `
            -Dicu=enabled `
            -Dzlib=enabled `
            -Dzstd=enabled `
            -Dlz4=enabled `
            -Dlibxml=enabled `
            -Dlibxslt=enabled `
            -Dldap=auto `
            -Dplperl=disabled `
            -Dplpython=disabled `
            -Dpltcl=disabled `
            "-Dextra_version=-psp-$shortSha"

      - name: Build
        shell: pwsh
        run: ninja -C build

      - name: Test
        shell: pwsh
        run: meson test -C build --num-processes 4 --print-errorlogs

      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            build/meson-logs/
            build/**/crashlog-*.txt
          retention-days: 14
