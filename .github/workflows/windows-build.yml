name: Windows build
run-name: "Windows build — ${{ github.event_name }} @ ${{ github.sha }}"

on:
  push:
    branches:
      - "PSP_REL_*"
      - "wininst"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install vcpkg deps
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "ci/windows/vcpkg.json"
          runVcpkgInstall: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.4"

      - name: Install meson and ninja
        shell: pwsh
        run: |
          pip install --upgrade meson ninja

      - name: Install Pester and run unit tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0
          $result = Invoke-Pester -Path ci/windows/scripts/Tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Install flex and bison
        shell: pwsh
        run: |
          choco install --no-progress -y winflexbison3

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install --no-progress -y pkgconfiglite

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $shortSha = "${{ github.sha }}".Substring(0,7)
          ./ci/windows/scripts/configure.ps1 -ExtraVersion "-psp-$shortSha"

      - name: Build
        shell: pwsh
        run: ./ci/windows/scripts/build.ps1

      - name: Test
        shell: pwsh
        timeout-minutes: 50
        continue-on-error: true
        run: |
          ./ci/windows/scripts/test.ps1 -Suite setup,regress
          exit $LASTEXITCODE

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            build/meson-logs/
            build/testrun/**/log/**
            build/testrun/**/regress_log/**
            build/**/crashlog-*.txt
            build/**/*.pdb
          retention-days: 14
          if-no-files-found: ignore
