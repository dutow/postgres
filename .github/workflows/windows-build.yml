name: Windows build
run-name: "Windows build — ${{ github.event_name }} @ ${{ github.sha }}"

on:
  push:
    branches:
      - "PSP_REL_*"
      - "wininst"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install vcpkg deps
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "ci/windows/vcpkg.json"
          runVcpkgInstall: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.4"

      - name: Install meson and ninja
        shell: pwsh
        run: |
          pip install --upgrade meson ninja

      - name: Install flex and bison
        shell: pwsh
        run: |
          choco install --no-progress -y winflexbison3

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $shortSha = "${{ github.sha }}".Substring(0,7)
          meson setup build `
            --buildtype=release `
            --prefix=C:/stage/pgsql `
            --pkg-config-path="$env:VCPKG_ROOT/installed/x64-windows/lib/pkgconfig" `
            -Dssl=openssl `
            -Dicu=enabled `
            -Dzlib=enabled `
            -Dzstd=enabled `
            -Dlz4=enabled `
            -Dlibxml=enabled `
            -Dlibxslt=enabled `
            -Dldap=auto `
            -Dplperl=disabled `
            -Dplpython=disabled `
            -Dpltcl=disabled `
            "-Dextra_version=-psp-$shortSha"

      - name: Build
        shell: pwsh
        run: ninja -C build

      - name: Test
        shell: pwsh
        run: meson test -C build --num-processes 4 --print-errorlogs

      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            build/meson-logs/
            build/**/crashlog-*.txt
          retention-days: 14
