name: Windows build
run-name: "Windows build — ${{ github.event_name }} @ ${{ github.sha }}"

on:
  push:
    branches:
      - "PSP_REL_*"
      - "wininst"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pg_tde
        uses: actions/checkout@v4
        with:
          repository: dutow/pg_tde
          ref: wininst
          path: pg_tde
          submodules: recursive

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-installed-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('ci/windows/vcpkg.json', 'ci/windows/vcpkg-configuration.json') }}

      - name: Install vcpkg deps
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "ci/windows/vcpkg.json"
          vcpkgConfigurationJsonGlob: "ci/windows/vcpkg-configuration.json"
          runVcpkgInstall: true
          doNotCache: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.4"

      - name: Install meson and ninja
        shell: pwsh
        run: |
          pip install --upgrade meson ninja

      - name: Install Pester and run unit tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0
          $result = Invoke-Pester -Path ci/windows/scripts/Tests, ci/windows/scripts/pg_tde/Tests, ci/windows/installer/CustomActions/Tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Install flex and bison
        shell: pwsh
        run: |
          choco install --no-progress -y winflexbison3

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install --no-progress -y pkgconfiglite

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $shortSha = "${{ github.sha }}".Substring(0,7)
          ./ci/windows/scripts/configure.ps1 -ExtraVersion "-psp-$shortSha"

      - name: Build
        shell: pwsh
        run: ./ci/windows/scripts/build.ps1

      - name: Test
        shell: pwsh
        timeout-minutes: 50
        continue-on-error: true
        run: |
          ./ci/windows/scripts/test.ps1 -Suite setup,regress
          exit $LASTEXITCODE

      - name: Stage install tree
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ./ci/windows/scripts/stage.ps1 -DestDir C:/stage

      - name: Locate staged prefix
        id: stage_prefix
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:/stage -Recurse -Filter postgres.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "postgres.exe not found anywhere under C:/stage — meson install did not produce expected layout" }
          $prefix = $exe.Directory.Parent.FullName
          Write-Host "Staged prefix: $prefix"
          "prefix=$prefix" >> $env:GITHUB_OUTPUT

      - name: Configure pg_tde
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          ./ci/windows/scripts/pg_tde/configure.ps1 `
            -SourceDir "${{ github.workspace }}/pg_tde" `
            -StagePrefix "${{ steps.stage_prefix.outputs.prefix }}"

      - name: Build pg_tde
        shell: pwsh
        run: ./ci/windows/scripts/pg_tde/build.ps1

      - name: Stage pg_tde
        shell: pwsh
        run: ./ci/windows/scripts/pg_tde/stage.ps1

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Resolve version
        id: msi_version
        shell: pwsh
        run: |
          $v = ./ci/windows/scripts/version.ps1 -CommitSha "${{ github.sha }}"
          "msi_version=$($v.MsiVersion)" >> $env:GITHUB_OUTPUT
          "artifact_name=$($v.ArtifactName)" >> $env:GITHUB_OUTPUT
          "zip_name=$($v.ZipName)" >> $env:GITHUB_OUTPUT

      - name: Harvest staged tree
        shell: pwsh
        run: |
          ./ci/windows/scripts/harvest.ps1 `
            -StageDir "${{ steps.stage_prefix.outputs.prefix }}" `
            -OutFile ci/windows/installer/Files.wxs

      - name: Build MSI
        shell: pwsh
        run: |
          cd ci/windows/installer
          wix build Product.wxs UI.wxs Files.wxs `
            -ext WixToolset.UI.wixext `
            -d ProductVersion=${{ steps.msi_version.outputs.msi_version }} `
            -d StageDir="${{ steps.stage_prefix.outputs.prefix }}" `
            -o "${{ github.workspace }}/${{ steps.msi_version.outputs.artifact_name }}"

      - name: Create portable ZIP
        if: steps.msi_version.outputs.zip_name != ''
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ steps.stage_prefix.outputs.prefix }}\*" `
            -DestinationPath "${{ github.workspace }}/${{ steps.msi_version.outputs.zip_name }}"

      - name: Upload ZIP artifact
        if: always() && steps.msi_version.outputs.zip_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ github.sha }}
          path: ${{ steps.msi_version.outputs.zip_name }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload MSI artifact
        if: always() && steps.msi_version.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ github.sha }}
          path: ${{ steps.msi_version.outputs.artifact_name }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            build/meson-logs/
            build/testrun/**/log/**
            build/testrun/**/regress_log/**
            build/**/crashlog-*.txt
            build/**/*.pdb
            pg_tde_build/meson-logs/
            pg_tde_build/testrun/**/log/**
            pg_tde_build/testrun/**/regress_log/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish rolling release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-latest
          name: ${{ github.ref_name }} (latest build)
          body: |
            Rolling build from branch `${{ github.ref_name }}`.

            Commit: ${{ github.sha }}
            Updated: automatically on every successful push.
          prerelease: true
          files: |
            ${{ steps.msi_version.outputs.artifact_name }}
            ${{ steps.msi_version.outputs.zip_name }}
          fail_on_unmatched_files: true
